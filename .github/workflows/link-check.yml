name: Link check

on:
  schedule:
    - cron: '0 5 * * 1'   # ogni lunedi
  workflow_dispatch:

permissions: {}

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: [self-hosted, linux, obscura]
    timeout-minutes: 90   # richieste vere con limite per host e secondo tentativo
    permissions:
      contents: write   # committa i dati aggiornati
      issues: write     # apre o aggiorna l'issue dei link rotti
    steps:
      # persist-credentials resta attivo: serve al `git push` di sotto (vedi .github/zizmor.yml)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify links, stamp last_verified, repair dead ones
        run: python3 scripts/verify_links.py --stale-days 30 --fix

      - name: Recover official sources from Wikipedia
        run: python3 scripts/relink_wikipedia.py --apply

      - name: Check er0s contract before committing
        run: python3 scripts/check_er0s_contract.py

      - name: Rebuild derived data, docs mirror and manifest
        run: |
          python3 scripts/export_data.py --docs
          python3 scripts/build_manifest.py

      - name: Commit updated verification dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --staged --quiet || git commit -m "chore: link check, last_verified + repairs $(date -I)"
          git push

      - name: Open issue for broken links
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('data/broken_links.json', 'utf8'));
            if (!report.broken.length) {
              core.info('No broken links.');
              return;
            }
            const body = [
              `Link check del ${report.checked_at}: **${report.broken.length} link rotti** su ${report.checked} controllati.`,
              '',
              `${report.fixed} POI sono stati spostati sul link OpenStreetMap generato dalle coordinate`,
              '(URL originale conservato in `link_rotto`), poi `relink_wikipedia.py` ha rimesso',
              'una voce di Wikipedia dove ne esiste una con le coordinate giuste.',
              'Restano da controllare a mano: la fonte ufficiale e sempre meglio del fallback.',
              '',
              '| URL | Errore | POI |',
              '|---|---|---|',
              ...report.broken.map(b => `| ${b.url} | ${b.error} | ${b.pois.join(', ')} |`),
            ].join('\n');
            const title = `Link rotti: ${report.broken.length} (${report.checked_at.slice(0,10)})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'needs-verification',
            });
            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['needs-verification'],
              });
            }
