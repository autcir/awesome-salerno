name: PR per l'ingest eventi
on:
  push:
    branches: [dati/eventi-automatici]
permissions: {}

concurrency:
  group: pr-ingest
  cancel-in-progress: false

jobs:
  apri-pr:
    name: apri-pr
    runs-on: [self-hosted, linux, obscura]
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write   # gh pr create apre la PR dell'ingest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # gh usa GH_TOKEN, non le credenziali di git
      - name: Apri o aggiorna la PR
        env:
          # GITHUB_TOKEN e' fornito da Actions: nessun token personale,
          # nessun segreto da mettere sulla VPS.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(python3 -c 'import json; print(len(json.load(open("data/eventi_scraped.json"))))')
          if gh pr view dati/eventi-automatici --json number >/dev/null 2>&1; then
            echo "PR gia' aperta: il push l'ha aggiornata"
          else
            gh pr create --base main --head dati/eventi-automatici \
              --title "dati: ingest eventi — ${N} eventi" \
              --body "Ingest automatico da soliso: **${N} eventi**.

          Ogni record porta \`source\`, \`license\`, \`retrieved_at\`, \`provenance\` e \`curated: false\`.
          Gli eventi non riconfermati per oltre 21 giorni escono da soli.

          Generato da \`scripts/ingest_events.py\`. Guarda il diff prima di unire."
          fi
