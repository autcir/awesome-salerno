name: Monthly digest

on:
  schedule:
    - cron: '0 7 1 * *'   # il primo di ogni mese
  workflow_dispatch:

permissions: {}

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    name: digest
    runs-on: [self-hosted, soliso, autcir, awesome-salerno]
    timeout-minutes: 15
    permissions:
      contents: write   # committa e spinge il digest
    steps:
      # persist-credentials resta attivo: serve al `git push` di sotto (vedi .github/zizmor.yml)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # build_digest.py legge la storia per il changelog

      - name: Build digest
        run: python3 scripts/build_digest.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest
          git diff --staged --quiet || git commit -m "chore: digest $(date +%Y-%m)"
          git push
