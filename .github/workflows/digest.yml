name: Monthly digest

on:
  schedule:
    - cron: '0 7 1 * *'   # il primo di ogni mese
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: [self-hosted, linux, obscura]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build_digest.py legge la storia per il changelog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build digest
        run: python3 scripts/build_digest.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest
          git diff --staged --quiet || git commit -m "chore: digest $(date +%Y-%m)"
          git push
