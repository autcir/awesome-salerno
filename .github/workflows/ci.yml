name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: [self-hosted, linux, obscura]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx awesome-lint
      - run: node scripts/test_ask.js

  validate-data:
    runs-on: [self-hosted, linux, obscura]
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          for f in data/*.json; do
            python3 -c "import json; json.load(open('$f'))" || exit 1
            echo "✓ $f"
          done
      - name: Check unique POI ids
        run: |
          python3 -c "
          import json, collections, sys
          ids = []
          for cat in ['sentieri','monumenti','spiagge','eventi','panorami','parchi']:
              ids += [i['id'] for i in json.load(open(f'data/{cat}.json'))]
          dup = [k for k, n in collections.Counter(ids).items() if n > 1]
          if dup:
              print('ERROR: duplicate ids:', dup)
              sys.exit(1)
          print(f'{len(ids)} POI, all ids unique')
          "

      - name: Check GPS coordinates
        run: |
          python3 -c "
          import json, sys
          errors = 0
          for cat in ['sentieri', 'monumenti', 'spiagge', 'eventi', 'panorami', 'parchi']:
              with open(f'data/{cat}.json') as f:
                  items = json.load(f)
              for i, item in enumerate(items):
                  lat = item.get('lat', 0)
                  lng = item.get('lng', 0)
                  if lat == 0 and lng == 0:
                      print(f'ERROR: {cat}[{i}] has GPS (0,0)')
                      errors += 1
                  elif lat < 39 or lat > 42 or lng < 14 or lng > 16:
                      print(f'ERROR: {cat}[{i}] GPS out of bounds ({lat},{lng})')
                      errors += 1
          if errors:
              print(f'{errors} GPS errors found')
              sys.exit(1)
          print('All GPS coordinates valid')
          "

  deploy-pages:
    runs-on: [self-hosted, linux, obscura]
    needs: [lint, validate-data]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync data to docs
        run: |
          rm -rf docs/data
          cp -r data docs/data
      # Non si passa da upload-pages-artifact: lo storage degli artifact e'
      # bloccato ("Artifact storage quota has been hit"). Questo metodo
      # pubblica spingendo sul ramo gh-pages, che non consuma quota ed e'
      # lo stesso gia' usato da auto-refresh.yml.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
